    - icon: "sbertech.svg"
      company: "Sber Tech"
      role: "Middle Software Engineer"
      employmentType:
        en: "Employment contract"
        ru: "ТК РФ"
      startDate: "2024-01"
      endDate: "2025-02"
      location:
        en: "Moscow, Russia"
        ru: "Москва, Россия"
      summary:
        en: >-
          Sber Tech develops Platform V, a large enterprise platform. In the Service Mesh & Platform Infrastructure team, I worked on a heavily customized Istio fork and adjacent Kubernetes components for workload control, policy enforcement, and platform integration.
        ru: >-
          Sber Tech развивает Platform V, крупную корпоративную платформу. В команде Service Mesh & Platform Infrastructure я работал с сильно кастомизированным форком Istio и смежными Kubernetes-компонентами для управления рабочими нагрузками, контроля политик и платформенной интеграции.
      highlights:
        - en: "Took over a component whose verification was almost entirely manual and run by a single QA engineer: restored the automated test suite in a heavily customized Istio fork and raised unit-test coverage to 80%, returning unit tests to daily development."
          ru: "Принял компонент, проверка которого была почти полностью ручной и выполнялась одним тестировщиком: восстановил набор автотестов в сильно кастомизированном форке Istio и поднял покрытие юнит-тестами до 80%, вернув их в ежедневную разработку."
        - en: "Kept the fork current with upstream: merged successive upstream Istio releases into Sber's heavily customized version and repaired the tests that broke on every merge."
          ru: "Держал форк в актуальном состоянии: вливал последовательные upstream-релизы Istio в сильно кастомизированную версию Сбера и чинил тесты, которые ломались на каждом мердже."
        - en: "Expanded integration tests to ~95% of critical functionality, moving defect detection before release instead of relying on later manual checks."
          ru: "Расширил интеграционные тесты до ~95% критического функционала, перенеся обнаружение дефектов на этап до релиза вместо поздних ручных проверок."
        - en: "Designed and built a Go integration-testing framework that provisioned isolated Kubernetes environments, ran suites in parallel, and generated Allure reports in CI."
          ru: "Спроектировал и реализовал Go-фреймворк интеграционного тестирования, который поднимал изолированные Kubernetes-окружения, запускал наборы тестов параллельно и генерировал Allure-отчёты в CI."
        - en: "Spotted an unmet platform need through a product manager and drove it end to end on my own initiative: ran requirements discovery with the DevOps teams that would use it, specified and presented the design, then built and delivered the component solo: a custom Kubernetes resource that makes Istio control-plane/data-plane relationships explicit instead of leaving them to implicit auto-wiring. Its users adopted it, and leadership later presented it as a target platform approach."
          ru: "Через продакт-менеджера заметил незакрытую платформенную потребность и по собственной инициативе довёл её end-to-end: собрал требования с командами DevOps, которые должны были им пользоваться, описал и защитил дизайн, а затем в одиночку разработал и внедрил компонент: пользовательский ресурс Kubernetes, который делает связи Istio control plane/data plane явными вместо неявной автоматической настройки. Пользователи его приняли, а руководство позже представило его как целевой платформенный подход."
        - en: "Repaired CI/CD pipelines and moved defect detection earlier in the development cycle for infrastructure changes."
          ru: "Починил CI/CD pipelines и перенёс обнаружение дефектов на более ранний этап разработки инфраструктурных изменений."
        - en: "Mentored ~10 School 21 interns on the framework and automation process, turning manual QA scenarios into scalable automated tests."
          ru: "Наставлял ~10 стажёров из Школы 21 по фреймворку и процессу автоматизации, переводя ручные QA-сценарии в масштабируемые автотесты."
