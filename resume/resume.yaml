preferences:
  title:
    en: "Additional Information"
    ru: "Дополнительная информация"
  items:
    - en: "I'm open to growing along either a tech-lead or an architecture track and prefer to let the team's needs decide the exact role, staying grounded in hands-on engineering either way."
      ru: "Открыт к развитию как в сторону тимлида, так и в архитектуру, и конкретную роль предпочитаю выбирать под задачи команды, в любом случае оставаясь практикующим инженером."
    - en: "I'm equally glad to deepen infrastructure, my focus for the last ~2 years at Sber Tech and ATOM, or to take on a new domain such as fintech, and I ramp up quickly in unfamiliar areas."
      ru: "Одинаково рад и углублять инфраструктуру, мой фокус последние ~2 года в Sber Tech и ATOM, и заходить в новый домен вроде финтеха; в незнакомых областях быстро погружаюсь."
    - en: "For roles that require working outside Russia, I am ready to work from Turkey: I have family there, so relocating my working base is straightforward. I am equally open to relocation packages elsewhere."
      ru: "Для позиций, которые требуют работы за пределами России, готов работать из Турции: там живут родственники, поэтому перенести рабочую базу для меня несложно. Так же открыт к релокации в другие страны."
    - en: "Among new domains, backend infrastructure around LLM platforms interests me most: the Go services, pipelines, integrations, and quality tooling that make model-based products reliable in production. These are engineering problems I already solve, applied to a fast-moving area."
      ru: "Из новых доменов мне интереснее всего backend-инфраструктура вокруг LLM-платформ: Go-сервисы, пайплайны, интеграции и инструменты контроля качества, которые делают продукты на моделях надёжными в production. Это те же инженерные задачи, что я решаю сейчас, только в быстро меняющейся области."
    - en: "Outside delivery work I keep deepening fundamentals and breadth: engineering books on distributed systems and clean architecture (Designing Data-Intensive Applications, Clean Code), and new languages studied the same way, from their reference books. I went through Python in depth and worked through Rust book in hand."
      ru: "Помимо рабочих задач постоянно углубляю фундамент и расширяю кругозор: инженерные книги по распределённым системам и чистой архитектуре (Designing Data-Intensive Applications, Clean Code) и новые языки, которые изучаю так же, по их основным книгам. Подробно разбирал Python, Rust прошёл по книге."
    - en: "I also build side projects to go deeper than delivery work allows: in Go, where I worked hands-on with WebRTC, RTP/RTCP, and video codecs, and in Python and Rust."
      ru: "Веду и пет-проекты, чтобы копать глубже, чем позволяют рабочие задачи: на Go, где я вплотную работал с WebRTC, RTP/RTCP и видеокодеками, а также на Python и Rust."
    - en: "Outside work I keep a disciplined, healthy routine: running, gym, swimming, and cycling. I also travel, with Japan high on my list to revisit."
      ru: "Вне работы держу дисциплинированный здоровый режим: бег, спортзал, плавание и велосипед. Люблю путешествия, Япония в начале списка мест, куда хочу вернуться."
