    - icon: "atom.svg"
      company:
        en: "ATOM"
        ru: "АТОМ"
      role: "Senior Software Engineer"
      employmentType:
        en: "Employment contract"
        ru: "ТК РФ"
      startDate: "2025-02"
      location:
        en: "Remote"
        ru: "Удаленно"
      summary:
        en: >-
          ATOM develops an electric-vehicle platform. In the communications and telemetry team, I build production backend services that keep vehicles securely connected to the cloud, integrate external clients, and support low-latency MQTT, gRPC, and API flows.
        ru: >-
          АТОМ развивает платформу электромобиля. В команде коммуникаций и телеметрии я строю production backend-сервисы, которые поддерживают защищенную связь автомобиля с облаком, интегрируют внешних клиентов и обеспечивают низколатентные MQTT, gRPC и API-сценарии.
      highlights:
        - en: "Built a high-load backend service that handles 70K+ requests per second at p99 latency below 50 ms, with headroom to scale beyond current load."
          ru: "Реализовал высоконагруженный backend-сервис, который обрабатывает 70K+ запросов в секунду при p99 ниже 50 мс и имеет запас для роста сверх текущей нагрузки."
        - en: "Independently drove requirements discovery for ambiguous, initially infeasible low-latency vehicle-to-cloud communication: aligned analysts, architects, and integration teams, identified feasible trade-offs, and brought the MVP scope to a documented, build-ready state in Confluence."
          ru: "Самостоятельно проработал требования к неоднозначной, изначально невыполнимой низколатентной связи автомобиля с облаком: синхронизировал аналитиков, архитекторов и команды интеграций, нашёл реалистичные компромиссы и довёл объём MVP до задокументированного в Confluence, готового к разработке состояния."
        - en: "Designed and co-developed an mTLS-secured MQTT broker on Mochi MQTT with certificate-based client authentication, topic-level authorization, and Redis-backed session/state recovery for persistent, restart-safe vehicle-to-cloud communication."
          ru: "Спроектировал и совместно разработал MQTT-брокер на Mochi MQTT с mTLS, аутентификацией клиентов по сертификатам, авторизацией на уровне топиков и восстановлением сессий/состояния через Redis для постоянной и устойчивой к перезапускам связи автомобиля с облаком."
        - en: "Reversed the planned architecture on a hard latency budget: a sub-50 ms broker response could not be guaranteed across the originally planned multi-service split, so once the requirements were relaxed I collapsed the design into one low-latency service that meets the budget."
          ru: "Развернул изначальную архитектуру под жёсткий бюджет задержки: ответ брокера быстрее 50 мс нельзя было гарантировать при исходном дроблении на множество сервисов, поэтому после смягчения требований я свёл дизайн к одному низколатентному сервису, который укладывается в бюджет."
        - en: "Made the broker the connection layer between the vehicle fleet and the cloud platform: it balances vehicle connections, keeps the link continuously available, and buffers messages a car produces while it is offline so nothing is lost until connectivity returns."
          ru: "Сделал брокер связующим слоем между парком автомобилей и облачной платформой: он балансирует соединения машин, поддерживает связь постоянно доступной и буферизует сообщения, которые автомобиль формирует без интернета, чтобы ничего не терялось до восстановления связи."
        - en: "Shipped the broker to production in December 2025; it now carries all vehicle-to-cloud traffic, adjacent teams integrate through it, and I stayed on as its technical owner after release."
          ru: "Вывел брокер в production в декабре 2025 года; сейчас через него идёт весь трафик между автомобилем и облаком, смежные команды интегрируются через него, а после релиза я остался его техническим владельцем."
        - en: "Owned the key technical decisions for the broker: stack, hexagonal architecture, service boundaries. Planned and created the team's tasks ahead of time, ran code review, and coordinated directly with adjacent teams and management."
          ru: "Владел ключевыми техническими решениями по брокеру: стек, гексагональная архитектура, границы сервисов. Планировал и заводил задачи команде наперёд, проводил code review и напрямую координировался со смежными командами и руководством."
        - en: "Built production observability from scratch: metrics, logs, traces, dashboards, alerts, latency and throughput monitoring. It made the broker the place where cross-team integration defects get localized, and I use its traces to show which side of a service boundary a problem is on."
          ru: "С нуля построил production-наблюдаемость: metrics, logs, traces, dashboards, alerts, мониторинг latency и throughput. Благодаря ей брокер стал точкой, где локализуются интеграционные дефекты между командами, и по его трассировкам я показываю, на чьей стороне границы сервисов проблема."
        - en: "After the team lost dedicated DevOps support, took over CI/CD and deployment: build pipelines, manifests/charts, Ansible provisioning, and delivery automation."
          ru: "После ухода DevOps-инженера взял на себя CI/CD и деплой: build pipelines, manifests/charts, провижининг через Ansible и автоматизацию поставки."
        - en: "Ran the vehicle-facing services through GitOps: ArgoCD deploys them straight into the cluster from the repository, so the deployed state and the declared state are the same thing."
          ru: "Вёл сервисы, обслуживающие машины, по GitOps: ArgoCD разворачивает их прямо в кластер из репозитория, поэтому развёрнутое состояние всегда совпадает с описанным в коде."
        - en: "Ran the broker on managed Yandex Cloud databases instead of self-hosted ones: PostgreSQL and Redis with automatic scaling. Secrets and access were kept in Vault."
          ru: "Держал брокер на управляемых базах Yandex Cloud, а не на поднятых вручную: PostgreSQL и Redis с автоматическим масштабированием. Секреты и доступы хранил в Vault."
      stack:
