    - icon: "magnus.svg"
      company: "Magnus Tech"
      role: "Middle Go Backend Engineer"
      employmentType:
        en: "Self-employed"
        ru: "Самозанятость"
      startDate: "2023-01"
      endDate: "2024-01"
      location:
        en: "Remote"
        ru: "Удаленно"
      summary:
        en: >-
          Magnus Tech is a custom software development company. I worked on a pricing-control platform for the Bristol retail chain that unified store data, employee actions, ML pricing recommendations, and photo confirmations into one workflow for operations teams.
        ru: >-
          Magnus Tech занимается заказной разработкой ПО. Я работал над платформой контроля цен для сети магазинов «Бристоль», которая объединяла данные магазинов, действия сотрудников, ML-рекомендации по ценам и фотоподтверждения в единый процесс для операционных команд.
      highlights:
        - en: "Designed and developed Go backend services from scratch for a pricing platform that combined competitor and online prices, purchase and delivery costs, and per-store data into a recommended price for each item, and tied those recommendations to what store employees actually did on the shelf."
          ru: "Спроектировал и разработал Go backend-сервисы с нуля для платформы ценообразования, которая сводила цены конкурентов и интернет-цены, стоимость закупки и доставки и данные по каждому магазину в рекомендованную цену для каждого товара и связывала эти рекомендации с тем, что сотрудники магазина реально делали на полке."
        - en: "Owned how the platform's data was modeled, stored, and served: store employees logged and photographed products, an ML model checked the photo confirmations, and my services kept that data consistent and delivered it to the frontend."
          ru: "Отвечал за то, как данные платформы моделируются, хранятся и отдаются: сотрудники магазинов заносили и фотографировали товары, ML-модель проверяла фотоподтверждения, а мои сервисы держали эти данные консистентными и отдавали их во frontend."
        - en: "Built REST APIs for admin and internal tools used to review prices, apply manual overrides, compare stores, inspect photo evidence, and coordinate corrective actions."
          ru: "Реализовал REST API для админки и внутренних инструментов, через которые проверяли цены, применяли ручные корректировки, сравнивали магазины, изучали фотоподтверждения и координировали корректирующие действия."
        - en: "Integrated web, email, SMS, and mobile notification flows and kept API contracts stable for frontend and mobile teams; message and notification templates were stored in MongoDB."
          ru: "Интегрировал уведомления через web, email, SMS и мобильные клиенты и поддерживал стабильные API-контракты для frontend- и mobile-команд; шаблоны сообщений и уведомлений хранились в MongoDB."
        - en: "Used ClickHouse for the analytical side of pricing data, keeping heavy reporting reads off the transactional database."
          ru: "Использовал ClickHouse под аналитическую часть данных о ценах, уводя тяжёлые отчётные чтения с транзакционной базы."
        - en: "Covered critical pricing-control flows with backend automated tests around price updates, manual overrides, and data-processing paths."
          ru: "Покрыл критичные сценарии контроля цен backend-автотестами вокруг обновления цен, ручных корректировок и обработки данных."
        - en: "Added Prometheus metrics and observability for critical flows and participated in the production launch after active development."
          ru: "Добавил Prometheus metrics и наблюдаемость для критичных сценариев и участвовал в production launch после активной разработки."
